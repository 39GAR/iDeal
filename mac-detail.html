---
layout: default
title: Mac Details
permalink: /mac-detail/
---

<section class="pdp">
  <div class="pdp__inner">
    <div class="pdp__gallery">
      <div class="media-frame media-frame--wide">
        <img id="pdpImage" class="media-frame__img" alt="" />
      </div>
      <div id="pdpDots" class="pdp__dots"></div>
    </div>

    <div class="pdp__info">
      <p class="pdp__eyebrow reveal">Mac</p>
      <h1 id="pdpTitle" class="pdp__title reveal"></h1>

      <div class="pdp__priceRow reveal">
        <span class="pdp__priceLabel">Starting from</span>
        <span id="pdpPrice" class="pdp__price"></span>
      </div>

      <!-- Color -->
      <div id="colorBlock" class="pdp__block reveal" hidden>
        <div class="pdp__blockHead">
          <h2 class="pdp__blockTitle">Color</h2>
          <span id="pdpColorName" class="pdp__muted"></span>
        </div>
        <div id="colorOptions" class="pdp__options"></div>
      </div>


      <!-- RAM -->
      <div id="ramBlock" class="pdp__block reveal" hidden>
        <div class="pdp__blockHead">
          <h2 class="pdp__blockTitle">Memory</h2>
          <span id="pdpRamName" class="pdp__muted"></span>
        </div>
        <div id="ramOptions" class="pdp__options"></div>
      </div>

      <!-- Storage -->
      <div id="storageBlock" class="pdp__block reveal" hidden>
        <div class="pdp__blockHead">
          <h2 class="pdp__blockTitle">Storage</h2>
          <span id="pdpStorageName" class="pdp__muted"></span>
        </div>
        <div id="storageOptions" class="pdp__options"></div>
      </div>

      <div class="pdp__ctaRow reveal">
        <a id="pdpBuy" class="pdp__btn" href="{{ '/checkout' | relative_url }}">Checkout</a>
        <p class="pdp__note">Secure checkout with Apple Pay, PayPal, or Bank Card.</p>
      </div>
    </div>
  </div>
</section>

<script>
(() => {
  const fmt = new Intl.NumberFormat("en-ZA", {
    style: "currency",
    currency: "ZAR",
    maximumFractionDigits: 0
  });

  const $ = (id) => document.getElementById(id);
  const slug = (new URLSearchParams(location.search).get("item") || "").trim();

  const macs = window.IDEAL_MACS || [];
  const product = macs.find(p => p.slug === slug);

  const titleEl = $("pdpTitle");
  const priceEl = $("pdpPrice");
  const imageEl = $("pdpImage");
  const dotsEl  = $("pdpDots");
  const buyEl   = $("pdpBuy");

  if (!product) {
    if (titleEl) titleEl.textContent = "Mac not found";
    if (priceEl) priceEl.textContent = "";
    return;
  }

  const settings = product.settings || {};
  const colors   = Array.isArray(product.colors) ? product.colors : [];
  const ram      = Array.isArray(product.ram) ? product.ram : [];
  const storage  = Array.isArray(product.storage) ? product.storage : [];

  const firstAvail = (arr) => arr.find(x => x && x.available !== false) || arr[0] || null;

  let selectedColor   = firstAvail(colors);
  let selectedRam     = firstAvail(ram);
  let selectedStorage = firstAvail(storage);

  // ===== Gallery (manual dots) =====
  let gallery = [];
  let galleryIndex = 0;

  const getGallery = () => {
    if (selectedColor && Array.isArray(selectedColor.images) && selectedColor.images.length) {
      return selectedColor.images;
    }
    if (selectedColor && typeof selectedColor.image === "string" && selectedColor.image) {
      return [selectedColor.image];
    }
    if (typeof product.image === "string" && product.image) {
      return [product.image];
    }
    return [];
  };

  const setGalleryIndex = (i) => {
    if (!gallery.length || !imageEl) return;
    galleryIndex = (i + gallery.length) % gallery.length;
    imageEl.src = gallery[galleryIndex] || "";
    imageEl.alt = product.model || "Mac";

    if (dotsEl) {
      [...dotsEl.children].forEach((d, idx) => {
        d.classList.toggle("is-active", idx === galleryIndex);
      });
    }
  };

  const renderDots = () => {
    if (!dotsEl) return;
    dotsEl.innerHTML = "";
    if (gallery.length <= 1) return;

    gallery.forEach((_, idx) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pdp__dot" + (idx === galleryIndex ? " is-active" : "");
      b.setAttribute("aria-label", `Image ${idx + 1}`);
      b.addEventListener("click", () => setGalleryIndex(idx));
      dotsEl.appendChild(b);
    });
  };

  // ===== Per-color storage availability =====
  const applyStorageAvailabilityForColor = () => {
    const root = $("storageOptions");
    if (!root || !selectedColor || !storage.length) return;

    const allowed = selectedColor.storage_available;

    if (!Array.isArray(allowed) || allowed.length === 0) {
      [...root.children].forEach((btn, i) => {
        const opt = storage[i];
        const globallyDisabled = (opt?.available === false);
        btn.disabled = globallyDisabled;
        btn.classList.toggle("is-disabled", globallyDisabled);
      });
      return;
    }

    [...root.children].forEach((btn, i) => {
      const opt = storage[i];
      if (!opt) return;

      const inAllowed = allowed.includes(opt.id) || allowed.includes(String(opt.id));
      const globallyOk = opt.available !== false;
      const ok = inAllowed && globallyOk;

      btn.disabled = !ok;
      btn.classList.toggle("is-disabled", !ok);
    });

    const selectedOk =
      allowed.includes(selectedStorage?.id) ||
      allowed.includes(String(selectedStorage?.id));

    if (!selectedOk) {
      const next = storage.find(s =>
        (allowed.includes(s.id) || allowed.includes(String(s.id))) && s.available !== false
      );
      if (next) selectedStorage = next;
    }
  };

  // ===== Price =====
  const computePrice = () => {
    const base = Number(product.base_price || 0);
    const c = Number(selectedColor?.price_delta || 0);
    const r = Number(selectedRam?.price_delta || 0);
    const s = Number(selectedStorage?.price_delta || 0);
    return base + c + r + s;
  };

  // ===== UI =====
  const updateUI = () => {
    if (titleEl) titleEl.textContent = product.model || "Mac";
    if (priceEl) priceEl.textContent = fmt.format(computePrice());

    if ($("pdpColorName")) $("pdpColorName").textContent = selectedColor?.name || "";
    if ($("pdpRamName")) $("pdpRamName").textContent = selectedRam?.label || "";
    if ($("pdpStorageName")) $("pdpStorageName").textContent = selectedStorage?.label || "";

    // gallery refresh per color
    gallery = getGallery();
    galleryIndex = 0;
    renderDots();
    setGalleryIndex(0);

    // checkout link
    if (buyEl) {
      const q = new URLSearchParams();
      q.set("item", product.slug);
      if (selectedColor?.id) q.set("color", selectedColor.id);
      if (selectedRam?.id) q.set("ram", selectedRam.id);
      if (selectedStorage?.id) q.set("storage", selectedStorage.id);
      buyEl.href = "{{ '/checkout' | relative_url }}" + "?" + q.toString();
    }
  };

  // ===== Options UI =====
  const renderOptions = (root, options, labelFn, onPick) => {
    if (!root) return;
    root.innerHTML = "";

    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pdp__opt";
      btn.textContent = labelFn(opt);

      if (opt?.available === false) {
        btn.classList.add("is-disabled");
        btn.disabled = true;
      }

      btn.addEventListener("click", () => onPick(opt));
      root.appendChild(btn);
    });
  };

  const setSelectedClass = (root, options, selected) => {
    if (!root) return;
    [...root.children].forEach((el, i) => {
      el.classList.toggle("is-selected", options[i] === selected);
    });
  };

  // Blocks visibility
  const showColors  = settings.enable_colors !== false && colors.length;
  const showRam     = settings.enable_ram !== false && ram.length;
  const showStorage = settings.enable_storage !== false && storage.length;

  if (showColors) {
    const block = $("colorBlock");
    const root  = $("colorOptions");
    if (block) block.hidden = false;

    renderOptions(root, colors, c => c.name, (c) => {
      selectedColor = c;
      setSelectedClass(root, colors, c);

      applyStorageAvailabilityForColor();
      setSelectedClass($("storageOptions"), storage, selectedStorage);

      updateUI();
    });

    setSelectedClass(root, colors, selectedColor);
  }

  if (showRam) {
    const block = $("ramBlock");
    const root  = $("ramOptions");
    if (block) block.hidden = false;

    renderOptions(root, ram, r => r.label, (r) => {
      selectedRam = r;
      setSelectedClass(root, ram, r);
      updateUI();
    });

    setSelectedClass(root, ram, selectedRam);
  }

  if (showStorage) {
    const block = $("storageBlock");
    const root  = $("storageOptions");
    if (block) block.hidden = false;

    renderOptions(root, storage, s => s.label, (s) => {
      selectedStorage = s;
      setSelectedClass(root, storage, s);
      updateUI();
    });

    setSelectedClass(root, storage, selectedStorage);
  }

  applyStorageAvailabilityForColor();
  setSelectedClass($("storageOptions"), storage, selectedStorage);
  updateUI();
})();
</script>
