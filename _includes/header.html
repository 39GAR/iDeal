<header class="ideal-nav" role="banner">
  <div class="ideal-nav__inner">
    <!-- Left: Logo -->
    <div class="ideal-nav__left">
  <a class="ideal-nav__homeBtn" href="{{ '/' | relative_url }}" aria-label="Home">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 11.5L12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-8.5z"
        fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
  </a>

  <a class="ideal-nav__logo" href="{{ '/' | relative_url }}" aria-label="iDeal Home">
    <img src="https://res.cloudinary.com/dodevsdjg/image/upload/v1767675363/ideal-logo-transparent_tld1gj.png"
      alt="iDeal" loading="eager" decoding="async" />
  </a>
</div>




    <!-- Center: Tabs -->
    <nav class="ideal-nav__menu" aria-label="Primary">
      <a class="ideal-nav__link" href="{{ '/mac' | relative_url }}">Mac</a>
      <a class="ideal-nav__link" href="{{ '/ipad' | relative_url }}">iPad</a>
      <a class="ideal-nav__link" href="{{ '/iphone' | relative_url }}">iPhone</a>
      <a class="ideal-nav__link" href="{{ '/watch' | relative_url }}">Watch</a>
      <!-- <a class="ideal-nav__link" href="{{ '/support' | relative_url }}">Contacts</a> -->
    </nav>

    <!-- Right: Search + Toggle -->
    <div class="ideal-nav__right">
      <button class="ideal-nav__iconBtn" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.5 3a7.5 7.5 0 105.02 13.08l3.2 3.2a1 1 0 001.41-1.41l-3.2-3.2A7.5 7.5 0 0010.5 3zm0 2a5.5 5.5 0 110 11 5.5 5.5 0 010-11z"/>
        </svg>
      </button>

      <button class="ideal-nav__toggle" type="button" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer (outside the grid!) -->
  <div class="ideal-nav__drawer" hidden>
    <a class="ideal-nav__drawerLink" href="{{ '/mac' | relative_url }}">Mac</a>
    <a class="ideal-nav__drawerLink" href="{{ '/ipad' | relative_url }}">iPad</a>
    <a class="ideal-nav__drawerLink" href="{{ '/iphone' | relative_url }}">iPhone</a>
    <a class="ideal-nav__drawerLink" href="{{ '/watch' | relative_url }}">Watch</a>
    <a class="ideal-nav__drawerLink" href="{{ '/support' | relative_url }}">Contacts</a>

    <button class="ideal-nav__drawerSearch" type="button" aria-label="Search">
      <span aria-hidden="true">⌕</span>
      <span>Search</span>
    </button>
  </div>
</header>

<!-- Search Overlay (hidden by default) -->
<div class="ideal-search" hidden aria-hidden="true">
  <div class="ideal-search__backdrop" data-close="search"></div>

  <div class="ideal-search__panel" role="dialog" aria-modal="true" aria-label="Search">
    <form
      class="ideal-search__top"
      id="siteSearchForm"
      action="{{ '/search' | relative_url }}"
      method="get"
    >
      <input
        type="search"
        class="ideal-search__input"
        name="q"
        placeholder="Search iDeal..."
        aria-label="Search"
      />

      <button
        class="ideal-search__close"
        type="button"
        aria-label="Close search"
        data-close="search"
      >
        ✕
      </button>
    </form>

  </div>
</div>
