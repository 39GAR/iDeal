# =========================
# MacBook Pro M3 Max 16"
# =========================
- slug: macbook-air-m2-max-16
  model: MacBook air 13-inch (M2 Max)
  base_price: 16600
  image: "https://res.cloudinary.com/dodevsdjg/image/upload/v1768238415/air-front_lbiw71.jpg"
  link: "/checkout"

  settings:
    enable_colors: true
    enable_storage: true

  colors:
    - id: midnight
      name: Midnight
      images:
        - "https://res.cloudinary.com/dodevsdjg/image/upload/v1768238221/midnight-macbook-air-1_yydyhv.jpg"
        - "https://res.cloudinary.com/dodevsdjg/image/upload/v1768238295/midnight-macbook-air-4_jltcel.jpg"
        - "https://res.cloudinary.com/dodevsdjg/image/upload/v1768238295/midnight-macbook-air-3_wlq43j.jpg"
        - "https://res.cloudinary.com/dodevsdjg/image/upload/v1768238284/midnight-macbook-air-2_txgd7r.jpg"
      price_delta: 0
      available: true

    - id: grey
      name: Grey
      images:
        - "https://res.cloudinary.com/dodevsdjg/image/upload/v1768238322/grey-macbook-air-5_vh91dd.jpg"
        - "https://res.cloudinary.com/dodevsdjg/image/upload/v1768238168/grey-macbook-air-1_pmfvuc.jpg"
        - "https://res.cloudinary.com/dodevsdjg/image/upload/v1768238193/grey-macbook-air-4_eod7ny.jpg"
        - "https://res.cloudinary.com/dodevsdjg/image/upload/v1768238192/grey-macbook-air-3_w9r9se.jpg"
      price_delta: 0
      available: true

  storage:
    - id: 512
      label: 512GB
      price_delta: 0
      available: true

    - id: 1tb
      label: 1TB SSD
      price_delta: 6000
      available: false

    - id: 2tb
      label: 2TB SSD
      price_delta: 12000
      available: false


