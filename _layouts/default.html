<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>{% if page.title %}{{ page.title }} — {% endif %}iDeal</title>

  <link rel="stylesheet" href="{{ '/main.css' | relative_url }}">

  <script>
  window.IDEAL_IPHONES = {{ site.data.iphones | jsonify }};
  window.IDEAL_MACS    = {{ site.data.macs    | jsonify }};
  window.IDEAL_IPADS   = {{ site.data.ipads   | jsonify }};
  window.IDEAL_WATCHES = {{ site.data.watches | jsonify }};
</script>

</head>
<body>

  {% include header.html %}

  <main class="page">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/script.js' | relative_url }}"></script>


</body>
</html>
